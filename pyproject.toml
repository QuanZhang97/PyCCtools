[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycctools"
version = "0.1.0"
description = "Seismic coda correlation and configurable phase-pair travel-time analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy>=1.24,<3", "scipy>=1.10,<2", "obspy>=1.4.2,<2",
  "pandas>=2,<4", "matplotlib>=3.7,<4", "requests>=2.31,<3",
  "pyfftw>=0.13,<1", "netCDF4>=1.6,<2",
]

[project.optional-dependencies]
maps = ["cartopy>=0.22,<1"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
pycctools = "pycctools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
